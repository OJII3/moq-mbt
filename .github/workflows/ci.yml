name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install MsQuic
        run: |
          curl -fsSLO https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y libmsquic
          for header in msquic.h msquic_posix.h quic_sal_stub.h; do
            curl -fsSL "https://raw.githubusercontent.com/microsoft/msquic/v2.5.12/src/inc/$header" -o "$RUNNER_TEMP/$header"
          done
          sudo install -m 0644 "$RUNNER_TEMP"/*.h /usr/local/include/
          msquic_lib="$(ldconfig -p | awk '$1 == "libmsquic.so.2" { print $NF; exit }')"
          test -n "$msquic_lib"
          sudo ln -s "$msquic_lib" /usr/local/lib/libmsquic.so
          sudo ldconfig

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit package registry
        run: moon update

      - name: Check MoonBit packages
        run: moon check --target native --deny-warn

      - name: Check JavaScript adapter
        run: |
          moon check --target js --deny-warn src/js_adapter
          moon build --target js src/js_adapter
          moon check --target js --deny-warn src/cmd/web_interop_probe
          moon build --target js src/cmd/web_interop_probe

      - name: Check portable packages on WebAssembly
        run: moon check --target wasm-gc --deny-warn src/protocol src/session

      - name: Run MoonBit tests
        run: moon test

      - name: Run protocol and session tests on JavaScript and WebAssembly
        run: |
          moon test --target js src/protocol src/session src/js_adapter
          moon test --target wasm-gc src/protocol src/session

      - name: Check formatting
        run: moon fmt --check

      - name: Install moq-rs relay
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev perl pkg-config
          cargo install --git https://github.com/cloudflare/moq-rs \
            --rev 8779758892d921bcfccbb6e4d9319c149db28c91 \
            --locked moq-relay-ietf --bin moq-relay-ietf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Playwright and Chromium
        run: |
          sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/playwright/bin/python" -m pip install --upgrade pip playwright
          "$RUNNER_TEMP/playwright/bin/python" -m playwright install --with-deps chromium

      - name: Run Native moq-rs interoperability
        run: bash scripts/check-interop.sh

      - name: Run browser WebTransport interoperability
        env:
          PYTHON: ${{ runner.temp }}/playwright/bin/python
        run: bash scripts/check-moq-rs-dual.sh
